# Files chezmoi fetches for you on `chezmoi apply` (runs on YOUR machine
# with real network — these URLs work there even where my fetcher can't go).

# zjstatus — the themeable status bar plugin used by both layouts
[".config/zellij/plugins/zjstatus.wasm"]
    type = "file"
    url = "https://github.com/dj95/zjstatus/releases/latest/download/zjstatus.wasm"
    refreshPeriod = "168h"

# ══════════════════════════════════════════════════════════════════
#  dopamine.nvim — your colorscheme (juliarozanova/dopamine.nvim).
#  Preferred install is via your nvim plugin manager (lazy spec in
#  README). If you'd rather have chezmoi vendor the whole plugin so a
#  fresh machine has it before lazy's first sync, uncomment:
#
# [".local/share/dopamine.nvim"]
#     type = "git-repo"
#     url = "https://github.com/juliarozanova/dopamine.nvim.git"
#     refreshPeriod = "168h"
#
#  …and point lazy at it with:  { dir = "~/.local/share/dopamine.nvim" }
#
#  Reference copy of the palette source, kept fresh for eyeballing:
[".config/zellij/themes/dopamine-colors-reference.lua"]
    type = "file"
    url = "https://raw.githubusercontent.com/juliarozanova/dopamine.nvim/master/lua/dopamine/colors.lua"
    refreshPeriod = "168h"
# ══════════════════════════════════════════════════════════════════
