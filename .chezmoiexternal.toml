# Files chezmoi fetches for you on `chezmoi apply` (runs on YOUR machine
# with real network — these URLs work there even where my fetcher can't go).

# (zjstatus removed — layouts now use zellij's built-in tab-bar + status-bar,
#  coloured by the dopamine component theme. No external plugin needed.)

# ══════════════════════════════════════════════════════════════════
#  dopamine colorscheme — installed via the nvim plugin manager, from a
#  local checkout (lazy spec: dot_config/nvim/lua/plugins/colorscheme.lua
#  → dir = "~/Dashboard/Code/dopamine-light"). If you'd rather have
#  chezmoi vendor the plugin so a fresh machine has it before lazy's
#  first sync, uncomment:
#
# [".local/share/dopamine.nvim"]
#     type = "git-repo"
#     url = "https://github.com/juliarozanova/dopamine-light.git"
#     refreshPeriod = "168h"
#
#  …and point lazy at it with:  { dir = "~/.local/share/dopamine.nvim" }
#
#  (There used to be a fetched reference copy of the plugin's colors.lua
#   here. It's gone: .chezmoidata/palette.toml is now the source those
#   colours come *from*, so a downstream copy would only ever mislead.)
# ══════════════════════════════════════════════════════════════════
