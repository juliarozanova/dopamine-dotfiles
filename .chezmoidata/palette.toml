# ══════════════════════════════════════════════════════════════════
#  THE dopamine palette — single source of truth for all colours.
#  Edit here → `chezmoi apply` → zellij theme + status bars re-render.
#
#  Ported from dopamine.nvim/lua/dopamine/colors.lua (dark variant
#  active; mirage + light commented below — swap a block to switch).
#  Slot mapping: mauve = accent  (copper — session badge)
#                pink  = constant (raspberry — active tab)
#                blue  = keyword  (slate: the scheme runs blue-less,
#                        so ANSI blue stays in-vibe for lazygit etc.)
# ══════════════════════════════════════════════════════════════════
[palette]
bg      = "#2B343D"   # bg
surface = "#323B44"   # panel_bg
overlay = "#8A9299"   # ui / fg_idle
fg      = "#D7DBDF"   # fg
pink    = "#CC5E87"   # constant — raspberry
mauve   = "#E6A46A"   # accent — warm copper
red     = "#E05260"   # error
peach   = "#CC8052"   # markup — terracotta
yellow  = "#E6BA7E"   # special — sand
green   = "#C4D27A"   # func / vcs_added — olive
teal    = "#5CC1AE"   # tag / entity
blue    = "#75859C"   # keyword — slate

