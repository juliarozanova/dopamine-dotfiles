# ══════════════════════════════════════════════════════════════════
#  THE dopamine palette — single source of truth for all colours.
#  Edit here → `chezmoi apply` → zellij theme + status bars re-render.
#
#  Values below are the ayu-dark base your dopamine.nvim reimplements
#  (github.com/juliarozanova/dopamine.nvim ← Luxed/ayu-vim lineage).
#  If your colors.lua diverges from stock ayu, correct them here.
#  Slot mapping: mauve = ayu accent (session badge pop),
#                pink  = constant violet (active tab).
#  Mirage variant kept below, commented, for a one-swap switch.
# ══════════════════════════════════════════════════════════════════
[palette]
bg      = "#0B0E14"
surface = "#11151C"
overlay = "#565B66"
fg      = "#BFBDB6"
pink    = "#D2A6FF"
mauve   = "#E6B450"
red     = "#D95757"
peach   = "#FF8F40"
yellow  = "#FFB454"
green   = "#AAD94C"
teal    = "#95E6CB"
blue    = "#59C2FF"

