# ══════════════════════════════════════════════════════════════════
#  THE dopamine palette — single source of truth for all colours.
#  Edit here → `chezmoi apply` → nvim colorscheme, WezTerm colour
#  schemes and the zellij theme all re-render from these values.
#
#  Consumers (all generated, none hand-edited):
#    .config/nvim/lua/dopamine_palette.lua  → injected into the
#        dopamine colorscheme via its `palette` option, so nvim's
#        highlight groups read from here.
#    .config/wezterm/wezterm.lua            → "Dopamine Dark" /
#        "Dopamine Light" schemes + ANSI slots.
#    .config/zellij/themes/dopamine.kdl     → component theme
#        (ribbon, tabs, frames, tables, lists).
#
#  Role names are the colorscheme's own semantic slots, ported from
#  dopamine.nvim/lua/dopamine/colors.lua. `dark` is the everyday
#  scheme; `light` is its counterpart (both follow macOS appearance);
#  `mirage` is the ayu-mirage-flavoured third variant, nvim-only.
# ══════════════════════════════════════════════════════════════════

[theme]
# Which variant single-scheme consumers use. Zellij has no notion of
# system appearance, so its `dopamine` theme is an alias for this one.
# (nvim + WezTerm ship every variant and switch on macOS appearance.)
variant = "dark"

# Colours that never vary between variants.
[shared]
white          = "#FFFFFF"
black          = "#000000"
# Not part of ayu — matches the default inlay-hint grey VSCode applies.
lsp_inlay_hint = "#969696"


# ══════════════════════════════════════════════════════════════════
#  dopamine-dark — cool slate ground, warm copper accent
# ══════════════════════════════════════════════════════════════════
[palette.dark]
# -- core
bg                 = "#2B343D"
fg                 = "#D7DBDF"
accent             = "#E6A46A"
ui                 = "#8A9299"
fg_idle            = "#8A9299"
# -- syntax
tag                = "#5CC1AE"
func               = "#C4D27A"
entity             = "#5CC1AE"
string             = "#DFE891"
regexp             = "#4CCFA1"
markup             = "#CC8052"
keyword            = "#75859C"
special            = "#E6BA7E"
comment            = "#90959B"
constant           = "#CC5E87"
operator           = "#4CCFA1"
error              = "#E05260"
warning            = "#E6A676"
lsp_parameter      = "#CC5E87"
# -- ui chrome
line               = "#242B33"
panel_bg           = "#323B44"
panel_shadow       = "#21282E"
panel_border       = "#2B343D"
gutter_normal      = "#5A626A"
gutter_active      = "#8A9299"
selection_bg       = "#515F6E"
selection_inactive = "#515F6E"
selection_border   = "#3E4954"
guide_active       = "#4A525B"
guide_normal       = "#3E4852"
# -- vcs
vcs_added          = "#C4D27A"
vcs_modified       = "#4CCFA1"
vcs_removed        = "#F0607D"
vcs_added_bg       = "#3A4434"
vcs_removed_bg     = "#46323C"
# -- foreground for text sitting ON a role used as a background
# (yazi's marker/mode chips). Dark's chips are all light-on-dark, so the page
# background doubles as the ink and these match `bg` exactly.
on_accent          = "#2B343D"
on_func            = "#2B343D"
on_special         = "#2B343D"
on_tag             = "#2B343D"
on_error           = "#2B343D"
on_markup          = "#2B343D"
on_ui              = "#2B343D"
# -- terminal-only tints
# Lifted keyword / constant, for ANSI bright blue + bright magenta.
# The scheme runs blue-less, so keyword's slate stands in for blue.
term_bright_blue    = "#ACB6C4"
term_bright_magenta = "#DB8EAB"


# ══════════════════════════════════════════════════════════════════
#  dopamine-light — paper ground, terracotta accent
# ══════════════════════════════════════════════════════════════════
[palette.light]
# -- core
bg                 = "#F8F9FA"
fg                 = "#5C6166"
accent             = "#CC8052"
ui                 = "#8A9199"
fg_idle            = "#8A9199"
# -- syntax
tag                = "#60AB96"
func               = "#AEBA5A"
entity             = "#60AB96"
string             = "#31786B"
regexp             = "#4CBF99"
markup             = "#C25234"
keyword            = "#CC8052"
special            = "#E6BA7E"
comment            = "#ABADB1"
constant           = "#DB5E8C"
operator           = "#4CBF99"
error              = "#E65050"
warning            = "#CC8052"
lsp_parameter      = "#DB5E8C"
# -- ui chrome
line               = "#E7EAED"
panel_bg           = "#F3F4F5"
panel_shadow       = "#D3D4D5"
panel_border       = "#F0F0F0"
gutter_normal      = "#CCCFD3"
gutter_active      = "#A0A6AC"
selection_bg       = "#C6D6D4"
selection_inactive = "#C6D6D4"
selection_border   = "#E1E1E2"
guide_active       = "#D2D5D8"
guide_normal       = "#E4E6E9"
# -- vcs
vcs_added          = "#AEBA5A"
vcs_modified       = "#4CBF99"
vcs_removed        = "#DB5E8C"
vcs_added_bg       = "#E0E7CD"
vcs_removed_bg     = "#F9EBE4"
# -- foreground for text sitting ON a role used as a background
# Light can't reuse `bg` here: its chips are mid-tone, so near-white text on
# them drops to 1.7:1. A near-black ink clears 4.5:1 on every chip except the
# terracotta `markup`, which is dark enough to want white instead.
on_accent          = "#1F2326"   # 5.11:1
on_func            = "#1F2326"   # 7.52:1
on_special         = "#1F2326"   # 8.81:1
on_tag             = "#1F2326"   # 5.85:1
on_error           = "#1F2326"   # 4.24:1
on_markup          = "#FFFFFF"   # 4.62:1 — ink would be only 3.43:1
on_ui              = "#1F2326"   # 4.97:1
# -- terminal-only tints
# Light needs its own darker/deeper ANSI variants: on paper the plain
# syntax colours are too pale to read as terminal red/yellow/blue.
term_blue           = "#637185"
term_bright_red     = "#C44444"
term_bright_yellow  = "#C49E6B"
term_bright_blue    = "#75859C"
term_bright_magenta = "#BA5077"


