keyword            = "#FFAD66"
special            = "#FFDFB3"
comment            = "#6C7A8B"
constant           = "#DFBFFF"
operator           = "#F29E74"
error              = "#FF6666"
warning            = "#FFA759"
lsp_parameter      = "#D3B8F9"
# -- ui chrome
line               = "#171B24"
panel_bg           = "#1C212B"
panel_shadow       = "#161922"
panel_border       = "#242A30"
gutter_normal      = "#4A505A"
gutter_active      = "#757B84"
selection_bg       = "#515F6E"
selection_inactive = "#23344B"
selection_border   = "#232A4C"
guide_active       = "#444A55"
guide_normal       = "#323843"
# -- vcs
vcs_added          = "#87D96C"
